name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub gets short-lived AWS credentials, no access keys stored.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets are cached for a year; HTML is always revalidated.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
